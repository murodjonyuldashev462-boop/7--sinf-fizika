const MP=`Sen 7-sinf fizika metodisti va HTML dasturchisisan. 2026–2027 oʻquv yili I chorak (4.09–31.10, 18 soat) mavzulari boʻyicha ishla:
1) Har bir mavzu uchun 3 ta dars reja tuz (savol-muammo → yangi bilim → mustahkamlash). Har rejada: maqsad, 45 daqiqalik vaqt taqsimoti, kutilgan natija, baholash mezoni.
2) Har bir rejaga 1 tadan interaktiv simulyatsiya qoʻsh (bitta HTML fayl, oʻzbek tilida, telefon va planshetga moslashgan, yorugʻ/qorongʻi rejim, slayder, "Tekshirish" tugmasi, natija va xatolar tahlili).
3) Mavzular jadval ketma-ketligida boʻlsin; takroriy mavzular (2 soat) ikkita dars sifatida kengaytirilsin.
4) Fizik xatolar boʻlmasin, til 7-sinf oʻquvchisiga mos va sodda boʻlsin.
Mavzular:
`+T.map((t,i)=>`${i+1}. ${t.t} (${t.d})`).join("\n");
function cp(id){const s=typeof id==="string"?(document.getElementById(id)||{}).textContent:id;try{navigator.clipboard.writeText(s)}catch(e){}}
/* simulyatsiyalar */
function Q(el,qs){let i=0,sc=0;(function show(){if(i>=qs.length){el.innerHTML=`<b>Natija: ${sc}/${qs.length}</b> <button>Qayta</button>`;el.querySelector("button").onclick=()=>Q(el,qs);return}
const [a,o,k]=qs[i];el.innerHTML=`<p>${a}</p>`+o.split("|").map((x,j)=>`<button data-k="${j}">${x}</button>`).join("");
el.querySelectorAll("button").forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===k;if(ok)sc++;b.className=ok?"ok":"no";el.querySelectorAll("button").forEach(x=>x.disabled=true);setTimeout(()=>{i++;show()},900)})})()}
function S(el,c,it){Q(el,it.map(x=>[x[0]+" — qaysi guruh?",c.join("|"),x[1]]))}
function R(el){let o,L;const n=()=>{o=Math.floor(Math.random()*4);L=Math.round((2+Math.random()*8)*2)/2;
let s="";for(let m=0;m<=120;m++){const x=15+m*2.5,h=m%10?m%5?8:14:20;s+=`<line x1="${x}" x2="${x}" y1="40" y2="${40+h}" stroke="currentColor"/>`;if(m%10==0)s+=`<text x="${x-4}" y="78" font-size="11" fill="currentColor">${m/10}</text>`}
el.innerHTML=`<svg viewBox="0 0 330 85"><rect x="${15+o*25}" y="12" width="${L*25}" height="18" fill="#2563eb"/><line x1="15" x2="315" y1="40" y2="40" stroke="currentColor"/>${s}</svg><p>Koʻk jism uzunligi necha sm? (jism 0 dan boshlanmaydi!)</p><input type="number" step="0.5"> <button>Tekshirish</button><div class="out"></div>`;
el.querySelector("button").onclick=()=>{const v=parseFloat(el.querySelector("input").value),d=el.querySelector(".out");d.textContent=Math.abs(v-L)<.01?"✅ Toʻgʻri! Keyingisi…":`❌ Toʻgʻri javob: ${L} sm (oxirgi chiziq − boshlangʻich chiziq).`;if(Math.abs(v-L)<.01)setTimeout(n,1200)}};n()}
function G(el){const a=3+Math.floor(Math.random()*4),b=3+Math.floor(Math.random()*3),c=1+Math.floor(Math.random()*2),d=1+Math.floor(Math.random()*2),A=a*b-c*d;let s="";
for(let x=0;x<a;x++)for(let y=0;y<b;y++)if(!(x>=a-c&&y<d))s+=`<rect x="${10+x*28}" y="${10+y*28}" width="28" height="28" fill="#93c5fd" stroke="#1e40af"/>`;
el.innerHTML=`<svg viewBox="0 0 ${a*28+20} ${b*28+20}" width="${a*28+20}">${s}</svg><p>1 katak = 1 sm². Shakl yuzasi necha sm²?</p><input type="number"> <button>Tekshirish</button> <button>Yangi shakl</button><div class="out"></div>`;
const bs=el.querySelectorAll("button");bs[0].onclick=()=>el.querySelector(".out").textContent=+el.querySelector("input").value===A?"✅ Toʻgʻri!":`❌ Qayta sanang. (Toʻgʻri javob: ${A} sm²)`;bs[1].onclick=()=>G(el)}
function P(el){const k=el._k=(el._k||0)+1;el.innerHTML='<canvas width="300" height="200"></canvas><label>Ip uzunligi: <b>100</b> sm</label><input type="range" min="10" max="200" value="100"><p></p>';
const x=el.querySelector("canvas").getContext("2d"),r=el.querySelector("input"),p=el.querySelector("p"),lv=el.querySelector("b"),t0=performance.now();
(function f(){if(el._k!==k||el.hidden)return;const L=+r.value,T=2*Math.PI*Math.sqrt(L/100/9.81),t=(performance.now()-t0)/1000,a=.4*Math.cos(2*Math.PI*t/T),l=20+L*.8,px=150+l*Math.sin(a),py=10+l*Math.cos(a);
x.clearRect(0,0,300,200);x.strokeStyle=x.fillStyle=getComputedStyle(el).color;x.beginPath();x.moveTo(150,10);x.lineTo(px,py);x.stroke();x.beginPath();x.arc(px,py,10,0,7);x.fill();
lv.textContent=L;p.textContent=`T = 2π√(l/g) ≈ ${T.toFixed(2)} s · 10 tebranish ≈ ${(10*T).toFixed(1)} s. Uzunlik ortsa, davr ham ortadi.`;requestAnimationFrame(f)})()}
function E(el,names){el.innerHTML=names.map((n,i)=>`<p><b>${n}</b> — 3 marta oʻlchang (sm):<br><input type="number" step="any"> <input type="number" step="any"> <input type="number" step="any"></p>`).join("")+'<button>Hisoblash</button><div class="out"></div>';
el.querySelector("button").onclick=()=>{let o="";el.querySelectorAll("p").forEach((p,i)=>{const v=[...p.querySelectorAll("input")].map(x=>parseFloat(x.value));if(v.some(isNaN)){o+=`${names[i]}: 3 ta qiymat kiriting<br>`;return}
const m=v.reduce((a,b)=>a+b)/3,e=Math.max(...v.map(x=>Math.abs(x-m)));o+=`${names[i]}: ${m.toFixed(2)} ± ${e.toFixed(2)} sm<br>`});el.querySelector(".out").innerHTML=o}}
function sim(el,s){const f={q:()=>Q(el,s[1]),s:()=>S(el,s[1],s[2]),r:()=>R(el),g:()=>G(el),p:()=>P(el),e:()=>E(el,s[1])};f[s[0]]()}

const app=document.getElementById("app");
T.forEach((t,i)=>{if(i!==IDX)return;const pr=`7-sinf fizika, I chorak, ${i+1}-mavzu: «${t.t}» (${t.d}). Quyidagi 3 reja boʻyicha dars ishlanma va har biriga interaktiv simulyatsiya (bitta HTML, oʻzbek tilida) yoz:\n`+t.p.map((p,j)=>`${j+1}) ${p.h} — ${p.d}`).join("\n");
const d=document.createElement("details");d.open=true;d.innerHTML=`<summary>${i+1}. ${t.t} <span class="d">(${t.d})</span></summary>`+
t.p.map((p,j)=>`<div class="plan"><b>${j+1}-reja: ${p.h}</b><br>${p.d}<br><button class="go" data-j="${j}">▶ Simulyatsiya</button><div class="sim" hidden></div></div>`).join("");
d.querySelectorAll(".go").forEach(b=>b.onclick=()=>{const z=b.nextElementSibling;z.hidden=!z.hidden;if(!z.hidden)sim(z,t.p[b.dataset.j].s)});
app.appendChild(d)});
</script></body></html>
