<style>

<script>
const $=s=>document.querySelector(s);
const arrow=(g,x,y,dx,dy,c)=>{g.strokeStyle=g.fillStyle=c;g.lineWidth=3;g.beginPath();g.moveTo(x,y);g.lineTo(x+dx,y+dy);g.stroke();const a=Math.atan2(dy,dx);g.beginPath();g.moveTo(x+dx,y+dy);g.lineTo(x+dx-10*Math.cos(a-.4),y+dy-10*Math.sin(a-.4));g.lineTo(x+dx-10*Math.cos(a+.4),y+dy-10*Math.sin(a+.4));g.fill()};
const bar=(g,x,b,v,mx,c,l,fg)=>{const h=Math.min(150,v/mx*150);g.fillStyle=c;g.fillRect(x,b-h,34,h);g.fillStyle=fg;g.font="12px sans-serif";g.fillText(l,x,b+14)};
const sims={
force:{c:[[`F₁ (N)`,0,20,8,1],[`α₁ (°)`,0,360,0,5],[`F₂ (N)`,0,20,6,1],[`α₂ (°)`,0,360,90,5]],d(g,v,s,fg,W,H){const x=W/2,y=H/2,r=Math.PI/180,k=8;const ax=v[0]*Math.cos(v[1]*r),ay=-v[0]*Math.sin(v[1]*r),bx=v[2]*Math.cos(v[3]*r),by=-v[2]*Math.sin(v[3]*r);arrow(g,x,y,ax*k,ay*k,`#2a7de1`);arrow(g,x,y,bx*k,by*k,`#e08a1e`);arrow(g,x,y,(ax+bx)*k,(ay+by)*k,`#d63a3a`);g.fillStyle=fg;g.beginPath();g.arc(x,y,5,0,7);g.fill();const R=Math.hypot(ax+bx,ay+by),d=(Math.atan2(-(ay+by),ax+bx)/r+360)%360;return `R = ${R.toFixed(1)} N, yo‘nalish ${d.toFixed(0)}° (qizil — teng ta’sir etuvchi)`}},
gravity:{c:[[`m (kg)`,1,100,10,1],[`g (m/s²)`,1.6,24.8,9.8,.1]],d(g,v,s,fg,W,H){const P=v[0]*v[1],L=Math.min(120,15+P/18);g.strokeStyle=fg;g.strokeRect(W/2-30,H/2-60,60,40+v[0]/4);g.fillStyle=fg;g.fillText(`${v[0]} kg`,W/2-18,H/2-35);arrow(g,W/2,H/2-20+v[0]/4,0,L,`#d63a3a`);const n=v[1]<3?`Oy`:v[1]<5?`Mars`:v[1]<12?`Yer`:`Yupiter`;return `Og‘irlik P = m·g = ${P.toFixed(1)} N (${n} yaqinida), massa o‘zgarmaydi: ${v[0]} kg`}},
friction:{c:[[`m (kg)`,1,20,5,1],[`μ`,0,1,.3,.05],[`F (N)`,0,100,30,1]],d(g,v,s,fg,W,H){const N=v[0]*9.8,Ff=v[1]*N,mv=v[2]>Ff,a=mv?(v[2]-Ff)/v[0]:0;s.x=(s.x||0)+(s.v=(s.v||0)+a/60)/60*3;if(!mv)s.v=0;if(s.x>W-90){s.x=0;s.v=0}const y=H/2+20;g.strokeStyle=fg;g.beginPath();g.moveTo(0,y+30);g.lineTo(W,y+30);g.stroke();g.strokeRect(20+s.x*18%(W-90),y-10,50,40);const bx=20+s.x*18%(W-90);arrow(g,bx+50,y+10,Math.min(80,v[2]),0,`#2a7de1`);arrow(g,bx,y+10,-Math.min(80,Ff),0,`#d63a3a`);return `N=${N.toFixed(0)} N, F_ish=${Ff.toFixed(1)} N, ${mv?`tezlanish a=${a.toFixed(2)} m/s²`:`jism qo‘zg‘almaydi (tinchlik ishqalanishi = F)`}`}},
air:{c:[[`m (kg)`,.1,10,1,.1],[`Yuza (m²)`,.02,1,.2,.02]],d(g,v,s,fg,W,H){const k=.6*v[1],m=v[0];s.v=s.v||0;s.y=s.y||10;const a=9.8-k*s.v*s.v/m;s.v+=a/60;s.y+=s.v*1.2;if(s.y>H-20){s.y=10;s.v=0}g.fillStyle=fg;g.beginPath();g.arc(W/2,s.y,6+v[1]*14,0,7);g.fill();arrow(g,W-60,s.y,0,Math.min(70,m*9.8*2),`#d63a3a`);arrow(g,W-80,s.y,0,-Math.min(70,k*s.v*s.v*2),`#2a7de1`);return `v = ${s.v.toFixed(1)} m/s, v_cheg = ${Math.sqrt(m*9.8/k).toFixed(1)} m/s (qizil: mg, ko‘k: qarshilik)`}},
spring:{c:[[`yuk m (g)`,0,500,100,10],[`k (N/m)`,5,100,25,1]],d(g,v,s,fg,W,H){const F=v[0]*9.8/1000,x=F/v[1],L=40+Math.min(130,x*100*3);g.strokeStyle=fg;g.lineWidth=2;g.beginPath();g.moveTo(W/2-40,15);g.lineTo(W/2+40,15);g.moveTo(W/2,15);for(let i=1;i<=14;i++)g.lineTo(W/2+(i%2?12:-12),15+L*i/15);g.lineTo(W/2,15+L);g.stroke();g.fillStyle=`#e08a1e`;g.fillRect(W/2-18,15+L,36,14+v[0]/25);g.fillStyle=fg;g.fillText(`Δx=${(x*100).toFixed(1)} sm`,W/2+40,15+L/2);return `F = mg = ${F.toFixed(2)} N, Δx = ${(x*100).toFixed(1)} sm, k = F/Δx = ${(F/x).toFixed(1)} N/m`}},
work:{c:[[`F (N)`,0,100,40,1],[`s (m)`,0,20,5,1],[`α (°)`,0,90,30,5]],d(g,v,s,fg,W,H){const r=Math.PI/180,A=v[0]*v[1]*Math.cos(v[2]*r),y=H/2+30,bx=20+v[1]/20*(W-120);g.strokeStyle=fg;g.beginPath();g.moveTo(0,y+30);g.lineTo(W,y+30);g.stroke();g.strokeRect(bx,y-10,50,40);g.fillStyle=fg;g.fillText(`s=${v[1]} m`,20,y+50);arrow(g,bx+25,y+10,Math.min(90,v[0])*Math.cos(v[2]*r),-Math.min(90,v[0])*Math.sin(v[2]*r),`#2a7de1`);return `A = F·s·cosα = ${A.toFixed(1)} J${v[2]==90?` (kuch ko‘chishga ⊥ → ish 0)`:``}`}},
energy:{c:[[`m (kg)`,1,20,2,1],[`v (m/s)`,0,30,5,1],[`h (m)`,0,50,10,1]],d(g,v,s,fg,W,H){const K=v[0]*v[1]*v[1]/2,P=v[0]*9.8*v[2],M=Math.max(K,P,1);g.fillStyle=fg;g.beginPath();g.arc(40,H-30-v[2]*3,9,0,7);g.fill();g.fillRect(10,H-20,60,3);arrow(g,52,H-30-v[2]*3,v[1]*2,0,`#2a7de1`);bar(g,140,H-30,K,M,`#2a7de1`,`E_k`,fg);bar(g,200,H-30,P,M,`#2db37a`,`E_p`,fg);bar(g,260,H-30,K+P,M,`#d63a3a`,`E`,fg);return `E_k=${K.toFixed(0)} J, E_p=${P.toFixed(0)} J, E=${(K+P).toFixed(0)} J`}},
pend:{c:[[`burchak (°)`,5,80,45,1],[`m (kg)`,.1,5,1,.1]],d(g,v,s,fg,W,H){const L=1.5;s.t=(s.t||0)+1/60;const th=v[0]*Math.PI/180*Math.cos(Math.sqrt(9.8/L)*s.t),px=90,py=20,bx=px+130*Math.sin(th),by=py+130*Math.cos(th);g.strokeStyle=fg;g.lineWidth=2;g.beginPath();g.moveTo(px,py);g.lineTo(bx,by);g.stroke();g.fillStyle=`#e08a1e`;g.beginPath();g.arc(bx,by,10,0,7);g.fill();const E=v[1]*9.8*L*(1-Math.cos(v[0]*Math.PI/180)),P=v[1]*9.8*L*(1-Math.cos(th)),K=Math.max(0,E-P);bar(g,190,H-30,K,E||1,`#2a7de1`,`E_k`,fg);bar(g,240,H-30,P,E||1,`#2db37a`,`E_p`,fg);bar(g,290,H-30,E,E||1,`#d63a3a`,`E`,fg);return `E_k=${K.toFixed(2)} J, E_p=${P.toFixed(2)} J, E=${E.toFixed(2)} J (saqlanadi)`}}
};
Object.assign(sims,{
power:{c:[[`m (kg)`,1,100,20,1],[`h (m)`,1,20,5,1],[`t (s)`,1,30,5,1]],d(g,v,s,fg,W,H){s.t=((s.t||0)+1/60)%(v[2]+.5);const f=Math.min(1,s.t/v[2]),y=H-40-f*(H-80),A=v[0]*9.8*v[1];g.strokeStyle=fg;g.beginPath();g.moveTo(W/2,10);g.lineTo(W/2,y);g.stroke();g.fillStyle=`#e08a1e`;g.fillRect(W/2-18,y,36,24);g.fillStyle=fg;g.fillText(`${(f*v[1]).toFixed(1)} m`,W/2+26,y+16);g.fillRect(W/2-60,H-16,120,3);return `A = mgh = ${A.toFixed(0)} J, N = A/t = ${(A/v[2]).toFixed(1)} W`}},
moon:{c:[[`kun (0–29)`,0,29,0,.5]],d(g,v,s,fg,W,H){const cx=220,cy=110,R=70,th=v[0]/29.53*2*Math.PI;g.fillStyle=`#f0b429`;g.beginPath();g.arc(30,cy,22,0,7);g.fill();for(let i=-1;i<=1;i++)arrow(g,62,cy+i*18,70,0,`#f0b429`);g.fillStyle=`#2a7de1`;g.beginPath();g.arc(cx,cy,14,0,7);g.fill();g.strokeStyle=fg;g.globalAlpha=.3;g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();g.globalAlpha=1;const mx=cx-R*Math.cos(th),my=cy-R*Math.sin(th);g.fillStyle=`#666`;g.beginPath();g.arc(mx,my,9,0,7);g.fill();g.fillStyle=`#f5f0d0`;g.beginPath();g.arc(mx,my,9,Math.PI/2,Math.PI*1.5);g.fill();const d=v[0],k=(1-Math.cos(th))/2,n=d<1.8||d>27.7?`Yangi oy (Quyosh tutilishi mumkin)`:d<5.5?`O‘sayotgan hilol`:d<9.2?`Birinchi chorak`:d<13.5?`O‘suvchi oy`:d<16.3?`To‘lin oy (Oy tutilishi mumkin)`:d<20?`Kamayuvchi oy`:d<24?`Oxirgi chorak`:`Kamayuvchi hilol`;return `${d} kun: ${n}; yoritilgan qismi ≈ ${(k*100).toFixed(0)}%`}},
solar:{c:[[`sayyora (1–8)`,1,8,3,1],[`tezlik`,1,10,3,1]],d(g,v,s,fg,W,H){const N=[`Merkuriy`,`Venera`,`Yer`,`Mars`,`Yupiter`,`Saturn`,`Uran`,`Neptun`],a=[.39,.72,1,1.52,5.2,9.58,19.2,30.1];s.t=(s.t||0)+v[1]*.002;g.fillStyle=`#f0b429`;g.beginPath();g.arc(170,110,9,0,7);g.fill();a.forEach((q,i)=>{const r=20+i*11,T=Math.pow(q,1.5),an=2*Math.PI*s.t/T;g.strokeStyle=fg;g.globalAlpha=.25;g.beginPath();g.arc(170,110,r,0,7);g.stroke();g.globalAlpha=1;g.fillStyle=i==v[0]-1?`#d63a3a`:`#2a7de1`;g.beginPath();g.arc(170+r*Math.cos(an),110+r*Math.sin(an),i==v[0]-1?6:3.5,0,7);g.fill()});const i=v[0]-1;return `${N[i]}: a = ${a[i]} a.b., T = a^1,5 = ${Math.pow(a[i],1.5).toFixed(2)} yil`}},
ly:{c:[[`obyekt (0–5)`,0,5,2,1]],d(g,v,s,fg,W,H){const O=[[`Oy`,4.1e-8,`1,3 soniya`],[`Quyosh`,1.58e-5,`8,3 daqiqa`],[`Proksima Sentavr`,4.24,`4,24 yil`],[`Sirius`,8.6,`8,6 yil`],[`Somon yo‘li diametri`,1e5,`100 000 yil`],[`Andromeda`,2.5e6,`2,5 mln yil`]],o=O[v[0]],f=(Math.log10(o[1])+8)/15;g.strokeStyle=fg;g.strokeRect(20,100,300,24);g.fillStyle=`#2a7de1`;g.fillRect(20,100,300*f,24);g.fillStyle=fg;g.fillText(`logarifmik shkala: 10⁻⁸ … 10⁷ yorug‘lik yili`,20,150);g.fillText(o[0],20,90);return `${o[0]}: yorug‘lik yetib kelishi ≈ ${o[2]}`}},
polaris:{c:[[`kenglik φ (°)`,0,90,41,1]],d(g,v,s,fg,W,H){const y=H-50,x=60,r=Math.PI/180;g.strokeStyle=fg;g.beginPath();g.moveTo(10,y);g.lineTo(W-10,y);g.stroke();g.fillText(`Shimol →`,W-70,y+16);g.fillText(`← Janub`,12,y+16);g.fillStyle=fg;g.beginPath();g.arc(x,y,4,0,7);g.fill();const L=200,sx=x+L*Math.cos(v[0]*r),sy=y-L*Math.sin(v[0]*r);g.strokeStyle=`#e08a1e`;g.setLineDash([4,4]);g.beginPath();g.moveTo(x,y);g.lineTo(sx,sy);g.stroke();g.setLineDash([]);g.fillStyle=`#e08a1e`;g.beginPath();g.arc(sx,sy,6,0,7);g.fill();return `Qutb yulduzi balandligi ≈ ${v[0]}°${Math.abs(v[0]-41)<2?` (Toshkent kengligi)`:``}`}},
hubble:{c:[[`masofa (Mpk)`,0,1000,100,10]],d(g,v,s,fg,W,H){const V=70*v[0];for(let i=1;i<=4;i++){const x=40+i*(W-80)/4*(v[0]/1000)*.9+(i-1)*4,y=60+i*28;g.fillStyle=`#2a7de1`;g.beginPath();g.arc(x,y,6,0,7);g.fill();arrow(g,x+8,y,Math.min(60,V/500)*i/4+6,0,`#d63a3a`)}g.fillStyle=fg;g.fillText(`Biz (Somon yo‘li)`,10,30);g.beginPath();g.arc(20,45,6,0,7);g.fill();return `v = H·d = ${V.toLocaleString()} km/s (z ≈ ${(V/300000).toFixed(3)})`}}
});

const t={"n":"Energiya saqlanishi","d":"59–60-darslar","def":"Yopiq tizimda (ishqalanishsiz) to‘la mexanik energiya o‘zgarmaydi: kinetik va potensial energiya bir-biriga aylanadi, yig‘indisi doimiy qoladi.","f":["E_k + E_p = const","m·g·h₁ + m·v₁²/2 = m·g·h₂ + m·v₂²/2","Erkin tushishda: v = √(2gh)"],"m":["Rasm: tepadan tushayotgan to‘p — 3 holat (yuqori, o‘rta, past) va ostida energiya ustunlari.","Mayatnik simulyatsiyasida E_k va E_p ustunlari o‘zgaradi, E esa o‘zgarmaydi.","2-dars: masalalar. Algoritm: boshlang‘ich holat → oxirgi holat → energiyani tenglash."],"a":"Mayatnik va tushayotgan to‘p","s":"pend","q":["Jism 20 m balandlikdan tushmoqda (g=10). Yerga urilishdagi tezlik?","mgh = mv²/2 → v = √(2·10·20) = 20 m/s"],"h":["h=5 m dan tushgan toshning yerga urilish tezligini toping.","Nega real mayatnik to‘xtaydi? Energiya qayerga ketadi?"]};
const sim=sims[t.s]||null;let vals=sim?sim.c.map(c=>c[3]):[],S={};
const stages=[[`Motivatsiya`,5],[`Yangi mavzu (tarif, formula, rasm)`,15],[`Simulyatsiya / tajriba`,10],[`Masala yechish`,10],[`Xulosa va baho`,5]];
const L=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
$("#m").innerHTML=`<h2>${t.n}</h2><span class="bd">${t.d} · IV chorak</span>
<div class="c"><h3>📘 Aniq ta’rif</h3>${t.def}</div>
<div class="c"><h3>🧮 Fizik qoida va formulalar</h3>${t.f.map(x=>`<span class="f">${x}</span>`).join("")}</div>
<div class="c"><h3>🖼️ Tushuntirish metodi (rasmli)</h3>${L(t.m)}</div>
${sim?`<div class="c"><h3>🧪 Simulyatsiya</h3><canvas id="cv" width="340" height="220"></canvas>${sim.c.map((c,k)=>`<label><span>${c[0]}</span><input type="range" min="${c[1]}" max="${c[2]}" step="${c[4]}" value="${c[3]}" data-k="${k}"><b id="v${k}">${c[3]}</b></label>`).join("")}<p id="ro"></p></div>`:``}
${t.z?`<div class="c q"><h3>📝 Interaktiv nazorat</h3><p id="sc">To‘g‘ri: 0/${t.z.length}</p>${t.z.map((q,k)=>`<p><b>${k+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button data-q="${k}" data-o="${j}">${o}</button>`).join("")}</p>`).join("")}</div>`:``}
${t.q?`<div class="c"><h3>✏️ Masala yechish</h3>${t.q[0]}<details><summary>Javobni ko‘rish</summary>${t.q[1]}</details></div>`:``}
<div class="c"><h3>🗓️ Dars rejasi (45′)</h3><ol>${stages.map(s=>`<li>${s[0]} — ${s[1]}′${s[0]==`Simulyatsiya / tajriba`?`: ${t.a}`:``}</li>`).join("")}</ol></div>
<div class="c hw"><h3>🏠 Uyga vazifa</h3>${L(t.h)}</div>`;
document.querySelectorAll("input[type=range]").forEach(r=>r.oninput=()=>{vals[r.dataset.k]=+r.value;$("#v"+r.dataset.k).textContent=r.value;S={}});
let n=0;document.querySelectorAll(".q button").forEach(b=>b.onclick=()=>{const q=t.z[b.dataset.q],ok=+b.dataset.o==q[2];b.classList.add(ok?"ok":"no");if(ok){n++;$("#sc").textContent=`To‘g‘ri: ${n}/${t.z.length}`}});
function loop(){const cv=$("#cv");if(cv&&sim){const g=cv.getContext("2d"),fg=getComputedStyle(document.body).color;g.clearRect(0,0,340,220);g.font="12px sans-serif";g.lineWidth=2;$("#ro").textContent=sim.d(g,vals,S,fg,340,220)}requestAnimationFrame(loop)}
loop();
