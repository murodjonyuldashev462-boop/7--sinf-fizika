<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7-sinf Fizika · CHSB tayyorlov</title>
<style>:root{--bg:#f4f7fb;--card:#fff;--tx:#1b2a3a;--mut:#5b6b7c;--ac:#2563eb;--ln:#dbe3ee}
@media(prefers-color-scheme:dark){:root{--bg:#10161e;--card:#18212c;--tx:#e6edf5;--mut:#93a3b5;--ac:#5b8cff;--ln:#2a3645}}
*{box-sizing:border-box}body{margin:0 auto;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:12px;max-width:760px;line-height:1.5}
h1{font-size:20px;margin:6px 0}.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:10px}
button{font:inherit;border:0;background:var(--ac);color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer;margin-top:8px}
.mut{color:var(--mut);font-size:13px}summary{cursor:pointer;padding:3px 0}li{margin:3px 0}
canvas{width:100%;max-width:320px;display:block;border-radius:8px;margin:6px 0}
label.op{display:block;padding:5px 0}input[type=number]{width:110px;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.ok{color:#16a34a;font-weight:600}.no{color:#dc2626;font-weight:600}#bar{position:sticky;top:0;background:var(--bg);padding:6px 0;font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}</style></head><body>
<h1>7-sinf Fizika · CHSB tayyorlov</h1><div class="mut">Chorak bo‘yicha summativ baholash: 2-chorakning barcha mavzulari (23–34-darslar)</div>
<div class="card"><b>1-bosqich · Takrorlash</b><div id="rev"></div><button id="st" onclick="start()">Testni boshlash (40 daqiqa)</button></div>
<div id="ex" style="display:none"><div id="bar">⏱ <span id="tm"></span></div><div id="qs"></div><button onclick="fin()">Yakunlash</button></div>
<div id="res"></div>
<script>
const D={"nm": {"H": "Hajm", "M": "Massa", "V": "Vaqt", "X": "Mexanik harakat", "Z": "Tezlik", "G": "Grafiklar"}, "keys": ["H", "M", "V", "X", "Z", "G"], "rev": {"H": ["Hajm SI da m³ bilan o‘lchanadi. 1 l = 1 dm³ = 1000 ml; 1 ml = 1 sm³; 1 m³ = 1000 l", "Menzurka bo‘linma qiymati = (ikki yirik chiziq ayirmasi) / (oradagi bo‘linmalar soni)", "Shkalani o‘qishda ko‘z suv sathi bilan bir balandlikda bo‘ladi", "Jism hajmi: V = V₂ − V₁. To‘g‘ri burchakli jism: V = a·b·c"], "M": ["Massaning SI birligi — kg. 1 t = 1000 kg; 1 kg = 1000 g; 1 g = 1000 mg", "Pallali tarozi: jism chap pallada, toshlar o‘ng pallada; muvozanatda m = toshlar massalari yig‘indisi", "Massa jism turgan joyga bog‘liq emas"], "V": ["SI birligi — s. 1 min = 60 s; 1 soat = 3600 s", "Vaqt secundomer bilan o‘lchanadi", "Mayatnik davri T = t / N (N — tebranishlar soni)", "Ip uzunroq bo‘lsa T katta; yuk massasiga (kichik amplitudada) bog‘liq emas"], "X": ["Mexanik harakat — jism vaziyatining boshqa jismlarga nisbatan vaqt o‘tishi bilan o‘zgarishi", "Sanoq jismi tanlanadi; harakat nisbiy: bir jismga nisbatan tinch, boshqasiga nisbatan harakatda bo‘lishi mumkin", "Trayektoriya — harakat chizig‘i; yo‘l s — trayektoriya uzunligi (m)"], "Z": ["v = s/t;  s = v·t;  t = s/v. SI birligi — m/s", "1 m/s = 3,6 km/soat (km/soat → m/s uchun 3,6 ga bo‘l)", "O‘rtacha tezlik = butun yo‘l / butun vaqt", "Tezlikni o‘lchash: masofa va taymer vaqti bo‘yicha v = s/t"], "G": ["Tekis harakatda s–t grafigi — to‘g‘ri chiziq; v–t grafigi — gorizontal chiziq", "s–t grafigi tikroq bo‘lsa tezlik katta; gorizontal bo‘lsa jism tinch", "s = s₀ + v·t;  v–t grafigi ostidagi yuza — bosib o‘tilgan yo‘l"]}, "min": 40, "q": [{"k": "H", "q": "Hajmning SI dagi birligi:", "o": ["l", "ml", "m³", "sm³"], "a": 2, "e": "SI da hajm birligi — kub metr."}, {"k": "H", "q": "2,5 l necha ml?", "a": 2500, "u": "ml", "e": "1 l = 1000 ml", "s": null, "tol": 0.01}, {"k": "H", "q": "Rasmdagi 1- va 2-holat shkalalaridan jism hajmini toping.", "a": 60, "u": "sm³", "e": "V = V₂ − V₁ = 140 − 80", "s": ["cyl", 80, 140], "tol": 0.01}, {"k": "H", "q": "Menzurkada 100 ml va 150 ml belgilar orasida 5 ta bo‘linma bor. Bo‘linma qiymati necha ml?", "a": 10, "u": "ml", "e": "(150 − 100)/5 = 10", "s": null, "tol": 0.01}, {"k": "H", "q": "Menzurka shkalasini o‘qiyotganda ko‘z qayerda bo‘lishi kerak?", "o": ["Suv sathidan yuqorida", "Suv sathi bilan bir balandlikda", "Suv sathidan pastda", "Farqi yo‘q"], "a": 1, "e": "Ko‘z sath bilan bir balandlikda — xato kamayadi."}, {"k": "H", "q": "Eni 5 sm, bo‘yi 4 sm, balandligi 10 sm bo‘lgan jismning hajmi necha sm³?", "a": 200, "u": "sm³", "e": "V = a·b·c = 5·4·10", "s": null, "tol": 0.01}, {"k": "M", "q": "3,2 kg necha g?", "a": 3200, "u": "g", "e": "1 kg = 1000 g", "s": null, "tol": 0.01}, {"k": "M", "q": "Tarozi muvozanatda. Jism massasi necha g?", "a": 65, "u": "g", "e": "50 + 10 + 5 = 65 g", "s": ["bal", 50, 10, 5], "tol": 0.01}, {"k": "M", "q": "0,4 t necha kg?", "a": 400, "u": "kg", "e": "1 t = 1000 kg", "s": null, "tol": 0.01}, {"k": "M", "q": "Massaning SI dagi birligi:", "o": ["g", "kg", "t", "mg"], "a": 1, "e": "SI da massa birligi — kilogramm."}, {"k": "V", "q": "Rasmdagi secundomer ko‘rsatgan vaqt necha sekund?", "a": 75, "u": "s", "e": "1 min 15 s = 60 + 15", "s": ["tm", 75], "tol": 0.01}, {"k": "V", "q": "Mayatnik 20 ta tebranishni 30 s da bajardi. Davri T necha s?", "a": 1.5, "u": "s", "e": "T = t/N = 30/20", "s": null, "tol": 0.01}, {"k": "V", "q": "Mayatnik ipi uzaytirilsa, tebranish davri...", "o": ["ortadi", "kamayadi", "o‘zgarmaydi"], "a": 0, "e": "Ip uzun — davr katta."}, {"k": "V", "q": "Mayatnik yukining massasi oshirilsa (kichik amplitudada) davr...", "o": ["ortadi", "kamayadi", "o‘zgarmaydi"], "a": 2, "e": "Davr massaga bog‘liq emas."}, {"k": "V", "q": "2 soat necha sekund?", "a": 7200, "u": "s", "e": "2·3600", "s": null, "tol": 0.01}, {"k": "X", "q": "Mexanik harakat deb nimaga aytiladi?", "o": ["Jism massasining o‘zgarishi", "Jism vaziyatining boshqa jismlarga nisbatan vaqt o‘tishi bilan o‘zgarishi", "Jism hajmining o‘zgarishi", "Jismning qizishi"], "a": 1, "e": "Bu mexanik harakat ta’rifi."}, {"k": "X", "q": "Poezdda o‘tirgan yo‘lovchi qaysi jismga nisbatan tinch?", "o": ["Yo‘l chetidagi daraxtga", "Stansiya binosiga", "Vagonga", "Yerga"], "a": 2, "e": "Harakat nisbiy: vagonga nisbatan tinch."}, {"k": "X", "q": "Yo‘l (s) nima?", "o": ["Boshlang‘ich va oxirgi nuqta orasidagi to‘g‘ri masofa", "Trayektoriya uzunligi", "Harakat vaqti", "Tezlik"], "a": 1, "e": "Yo‘l — trayektoriya uzunligi."}, {"k": "Z", "q": "36 km/soat necha m/s?", "a": 10, "u": "m/s", "e": "36 : 3,6 = 10", "s": null, "tol": 0.01}, {"k": "Z", "q": "20 m/s necha km/soat?", "a": 72, "u": "km/soat", "e": "20 · 3,6 = 72", "s": null, "tol": 0.01}, {"k": "Z", "q": "Avtomobil 15 m/s tezlik bilan 12 s yurdi. Yo‘l necha m?", "a": 180, "u": "m", "e": "s = v·t = 15·12", "s": null, "tol": 0.01}, {"k": "Z", "q": "Velosipedchi 240 m yo‘lni 20 s da o‘tdi. Tezligi necha m/s?", "a": 12, "u": "m/s", "e": "v = s/t = 240/20", "s": null, "tol": 0.01}, {"k": "Z", "q": "Poyezd 5 m/s tezlik bilan 300 m yo‘lni necha sekundda o‘tadi?", "a": 60, "u": "s", "e": "t = s/v = 300/5", "s": null, "tol": 0.01}, {"k": "Z", "q": "Jism avval 100 m ni 20 s da, keyin 200 m ni 20 s da o‘tdi. O‘rtacha tezligi necha m/s?", "a": 7.5, "u": "m/s", "e": "(100+200)/(20+20)", "s": null, "tol": 0.01}, {"k": "Z", "q": "Avtomobil A va B nuqtalar orasidagi 90 m ni taymer bo‘yicha 6 s da o‘tdi. Tezligi necha m/s?", "a": 15, "u": "m/s", "e": "v = D/t = 90/6", "s": null, "tol": 0.01}, {"k": "G", "q": "Grafikdan t = 6 s dagi koordinatani toping.", "a": 40, "u": "m", "e": "Grafikdan s(0)=10 m, tezlik 5 m/s: s = 10 + 5·6", "s": ["gr", 5, 10], "tol": 2}, {"k": "G", "q": "Grafikdan jism tezligini toping.", "a": 4, "u": "m/s", "e": "v = (s(10) − s(0))/10 = 40/10", "s": ["gr", 4, 0], "tol": 0.2}, {"k": "G", "q": "v–t grafigi gorizontal chiziq bo‘lsa, harakat...", "o": ["tekis", "tezlanuvchan", "tinch holat", "aylanma"], "a": 0, "e": "Tezlik o‘zgarmas — tekis harakat."}, {"k": "G", "q": "v–t grafigi ostidagi yuza nimani bildiradi?", "o": ["Tezlikni", "Vaqtni", "Bosib o‘tilgan yo‘lni", "Massani"], "a": 2, "e": "Yuza = v·t = s."}]},$=id=>document.getElementById(id);let tm;
$('rev').innerHTML=D.keys.map(k=>`<details open><summary><b>${D.nm[k]}</b></summary><ul>${D.rev[k].map(p=>'<li>'+p+'</li>').join('')}</ul></details>`).join('');
function sim(cn,[t,a,b,d]){cn.width=320;cn.height=150;const c=cn.getContext('2d');c.fillStyle='#eaf3ff';c.fillRect(0,0,320,150);
 const L=(x,y,X,Y,w,o)=>{c.strokeStyle=o||'#4a5a6a';c.lineWidth=w||1;c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke()},
 T=(s,x,y,al,z)=>{c.fillStyle='#1b2a3a';c.font=(z||11)+'px system-ui';c.textAlign=al||'left';c.fillText(s,x,y)},
 O=(x,y,r,f)=>{c.fillStyle=f;c.beginPath();c.arc(x,y,r,0,7);c.fill()};
 if(t=='cyl')[[60,a,'1-holat'],[200,b,'2-holat']].forEach(([x,v,n],i)=>{const B=125,p=.6;c.fillStyle='rgba(56,140,230,.55)';c.fillRect(x,B-v*p,50,v*p);if(i)O(x+25,B-7,7,'#8a8f98');
  c.strokeStyle='#4a5a6a';c.lineWidth=2;c.beginPath();c.moveTo(x,5);c.lineTo(x,B);c.lineTo(x+50,B);c.lineTo(x+50,5);c.stroke();
  for(let q=0;q<=200;q+=10){L(x,B-q*p,x+(q%50?7:14),B-q*p,1);if(q%50==0)T(q,x-4,B-q*p+4,'right')}T(n,x+25,143,'center',12)});
 if(t=='bal'){L(60,50,260,50,5);L(160,50,160,120,5);L(110,120,210,120,6);L(60,50,35,95,1);L(60,50,85,95,1);L(260,50,235,95,1);L(260,50,285,95,1);
  c.fillStyle='#445';c.fillRect(30,95,60,5);c.fillRect(230,95,60,5);c.fillStyle='#f2a33a';c.fillRect(45,70,30,25);T('jism',60,86,'center');
  [a,b,d].forEach((v,i)=>{c.fillStyle='#5b7fa6';c.fillRect(234+i*19,v>20?77:83,18,v>20?18:12);c.fillStyle='#fff';c.font='9px system-ui';c.textAlign='center';c.fillText(v,243+i*19,v>20?89:92)});T('g',296,92)}
 if(t=='tm'){O(80,75,58,'#4a5a6a');O(80,75,54,'#fff');for(let i=0;i<60;i+=5){const g=i/60*6.283-1.571;L(80+46*Math.cos(g),75+46*Math.sin(g),80+52*Math.cos(g),75+52*Math.sin(g),1.5);if(i%15==0)T(i,80+38*Math.cos(g),79+38*Math.sin(g),'center')}
  const g=a%60/60*6.283-1.571;L(80,75,80+42*Math.cos(g),75+42*Math.sin(g),2.5,'#e0572d');const mm=Math.floor(a/60),ss=a%60;T('0'+mm+':'+(ss<10?'0':'')+ss,215,85,'center',30)}
 if(t=='gr'){const x0=40,y0=125,w=260,h=110;for(let i=0;i<=10;i++){L(x0+i*w/10,y0,x0+i*w/10,y0-h,1,'#d3deea');T(i,x0+i*w/10,y0+12,'center',10)}
  for(let v=0;v<=60;v+=10){L(x0,y0-v/60*h,x0+w,y0-v/60*h,1,'#d3deea');T(v,x0-4,y0-v/60*h+3,'right',10)}
  L(x0,y0,x0,y0-h,2);L(x0,y0,x0+w,y0,2);L(x0,y0-b/60*h,x0+w,y0-(b+a*10)/60*h,3,'#2563eb');T('s, m',x0-4,12,'right');T('t, s',x0+w,y0+12,'right')}}
function start(){$('st').style.display='none';$('ex').style.display='';
 $('qs').innerHTML=D.q.map((x,i)=>`<div class="card"><div class="mut">${i+1}-savol · ${D.nm[x.k]}</div>${x.q}${x.s?`<canvas id="c${i}"></canvas>`:''}<div>${x.o?x.o.map((o,j)=>`<label class="op"><input type="radio" name="r${i}" value="${j}"> ${o}</label>`).join(''):`<input type="number" step="any" id="n${i}"> ${x.u}`}</div><div id="f${i}"></div></div>`).join('');
 D.q.forEach((x,i)=>x.s&&sim($('c'+i),x.s));let t=D.min*60;const u=()=>{$('tm').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};u();
 tm=setInterval(()=>{t--;u();if(t<=0)fin()},1000)}
function fin(){clearInterval(tm);let ok=0;const tp={};
 D.q.forEach((x,i)=>{let g=false;if(x.o){const e=document.querySelector(`input[name=r${i}]:checked`);g=!!e&&+e.value==x.a}else{const r=parseFloat($('n'+i).value.replace(',','.'));g=!isNaN(r)&&Math.abs(r-x.a)<=x.tol}
  ok+=g;tp[x.k]=tp[x.k]||[0,0];tp[x.k][1]++;tp[x.k][0]+=g;const ans=x.o?x.o[x.a]:String(x.a).replace('.',',')+' '+x.u;
  $('f'+i).innerHTML=(g?'<span class="ok">To‘g‘ri ✔</span>':'<span class="no">Noto‘g‘ri ✘</span> To‘g‘ri javob: <b>'+ans+'</b>')+'<div class="mut">'+x.e+'</div>'});
 document.querySelectorAll('input').forEach(e=>e.disabled=true);$('ex').querySelector('button').style.display='none';$('bar').style.display='none';
 const p=Math.round(ok/D.q.length*100),lv=p>=85?'A’lo (5)':p>=70?'Yaxshi (4)':p>=55?'Qoniqarli (3)':'Takrorlash kerak (2)';
 $('res').innerHTML=`<div class="card"><h2 style="margin:0">Natija: ${ok} / ${D.q.length} · ${p}%</h2><b>${lv}</b>`+Object.keys(tp).map(k=>{const q=Math.round(tp[k][0]/tp[k][1]*100);return `<div style="margin-top:8px">${D.nm[k]}: ${tp[k][0]}/${tp[k][1]} ${q<70?'— <span class="no">takrorlang</span>':'✔'}<div class="bar"><i style="width:${q}%"></i></div></div>`}).join('')+`<button onclick="location.reload()">Qayta urinish</button></div>`;
 scrollTo(0,document.body.scrollHeight)}
</script></body></html>
