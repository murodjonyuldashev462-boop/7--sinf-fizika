const $=s=>document.querySelector(s);
const T=[
{n:`Kuchlar`,d:`38-dars`,def:`Kuch — jismlarning o‘zaro ta’sirini ifodalovchi vektor kattalik. Ta’sir natijasida jism tezligi yoki shakli o‘zgaradi. Birligi: nyuton (N).`,f:[`F = m·a`,`1 N = 1 kg·m/s²`],m:[`Rasm: jism + qizil strelka (kuch) chiziladi: strelka boshi — yo‘nalish, uzunligi — kattalik.`,`Demo: aravachani itarish — tezlik o‘zgaradi; plastilinni siqish — shakl o‘zgaradi.`,`Nyuton qonunlari: inersiya, F=ma, ta’sir va aks ta’sir.`],a:`Stol ustida aravacha va dinamometr bilan tajriba`,s:`force`,q:[`m = 2 kg jism a = 3 m/s² tezlanish oldi. F=?`,`F = ma = 6 N`],h:[`Kundalik hayotdan 5 ta kuch misolini yozing va ularning natijasini (tezlik/shakl) belgilang.`,`m=5 kg, a=2 m/s² bo‘lsa F=?`]},
{n:`Kuch qiymati va yo‘nalishi`,d:`39-dars`,def:`Kuch vektor: son qiymati (modul) va yo‘nalishi bilan aniqlanadi. Bir nechta kuchning ta’siri teng ta’sir etuvchi (R) bilan almashtiriladi.`,f:[`Bir yo‘nalish: R = F₁+F₂`,`Qarama-qarshi: R = |F₁−F₂|`,`Perpendikulyar: R = √(F₁²+F₂²)`],m:[`Dinamometr bilan kuchni o‘lchash (shkala bo‘limi, aniqlik).`,`Vektorlarni parallelogramm usulida qo‘shish (daftarda masshtab: 1 sm = 1 N).`,`Simulyatsiya: burchaklarni o‘zgartirib R ni kuzating.`],a:`Ikki o‘quvchi arqonni tortadi — R ni topamiz`,s:`force`,q:[`3 N va 4 N kuchlar o‘zaro perpendikulyar. R=?`,`R = √(9+16) = 5 N`],h:[`F₁=6 N, F₂=8 N: uch holat (bir yo‘nalish, qarama-qarshi, perpendikulyar) uchun R ni toping.`,`Daftarda masshtabda chizib tekshiring.`]},
{n:`Gravitatsiya kuchi`,d:`40–41-darslar`,def:`Gravitatsiya — barcha jismlarning bir-biriga tortilishi. Yer jismni o‘ziga tortadigan kuch — og‘irlik kuchi. Massa (kg) o‘zgarmas, og‘irlik (N) sayyoraga bog‘liq.`,f:[`F = m·g`,`g = 9,8 m/s² (≈10)`,`F = G·m₁m₂/r²`,`Oyda g≈1,6 m/s²`],m:[`1-dars: erkin tushish, g ning kelib chiqishi; Nyuton olmasi hikoyasi (rasm).`,`2-dars: sayyoralarda og‘irlik jadvali (Oy 1,6; Mars 3,7; Yer 9,8; Yupiter 24,8).`,`Massa va og‘irlikni farqlash: massa — modda miqdori, og‘irlik — kuch.`],a:`Tosh va qog‘oz tushishi (havosiz va havoli)`,s:`gravity`,q:[`15 kg jismning Oydagi og‘irlik kuchi?`,`F = 15·1,6 = 24 N`],h:[`O‘z massangiz bo‘yicha Yer, Oy va Marsdagi og‘irligingizni hisoblang.`,`Nima uchun astronavt Oyda baland sakraydi? Tushuntiring.`]},
{n:`Ishqalanish kuchi`,d:`42–43-darslar`,def:`Ishqalanish kuchi — tegib turgan sirtlar orasida harakatga qarshi yo‘nalgan kuch. Turlari: tinchlik, sirpanish, dumalash (eng kichik). Foydali (yurish, tormoz) va zararli (mashina yeyilishi) bo‘lishi mumkin.`,f:[`F_ish = μ·N`,`N = m·g (gorizontal sirtda)`,`a = (F − F_ish)/m`],m:[`1-dars: turlari; sirtni silliqlash/g‘adir-budir qilib ko‘rsatish.`,`2-dars: μ ni aniqlash — brusokni dinamometr bilan bir tekis tortish: μ = F/(mg).`,`Ishqalanishni kamaytirish: moy, podshipnik; oshirish: g‘adir-budur, protektor.`],a:`Brusok va dinamometr: yog‘och, mato, shisha sirt`,s:`friction`,q:[`m=10 kg, μ=0,2. Ishqalanish kuchi?`,`N=mg=98 N; F = 0,2·98 = 19,6 N`],h:[`Uyda 3 xil sirtda (stol, gilam, kafel) qutini tortib μ ni taqqoslang.`,`Qishda yo‘lga qum sepish sababini yozing.`]},
{n:`Havoning qarshiligi`,d:`44-dars`,def:`Havoning qarshilik kuchi harakatga qarama-qarshi yo‘nalgan; tezlik va jism yuzasi ortishi bilan ortadi. Qarshilik og‘irlikka tenglashganda jism o‘zgarmas (chegaraviy) tezlik bilan tushadi.`,f:[`F_q ≈ k·v²`,`v_cheg = √(m·g/k)`],m:[`Qog‘oz varag‘i: yoyilgan va g‘ijimlangan holda tushirish.`,`Parashyut: katta yuza → katta qarshilik → kichik tezlik.`,`Avtomobil/samolyot shaklining obtekaemligi.`],a:`Ikki xil parashyut modeli sinovi`,s:`air`,q:[`Parashyutchi doimiy tezlikda tushmoqda. F_q va mg haqida nima deysiz?`,`Teng: F_q = mg, teng ta’sir etuvchi 0.`],h:[`Qog‘ozdan 2 ta parashyut yasab, tushish vaqtini o‘lchang.`,`Nima uchun yomg‘ir tomchisi o‘ldirmaydi?`]},
{n:`Elastiklik kuchi`,d:`45-dars`,def:`Elastiklik kuchi — jism deformatsiyalanganda hosil bo‘ladigan, dastlabki shaklni tiklashga intiluvchi kuch. Guk qonuni: kuch cho‘zilishga to‘g‘ri proporsional.`,f:[`F = k·Δx`,`k — bikrlik (N/m)`],m:[`Prujinaga yuk osib cho‘zilishni o‘lchash.`,`Deformatsiya turlari: cho‘zilish, siqilish, egilish, buralish.`,`Elastik chegara: undan keyin qoldiq deformatsiya.`],a:`Prujinaga 100 g, 200 g, 300 g yuk osish`,s:`spring`,q:[`k=50 N/m, Δx=4 cm. F=?`,`F = 50·0,04 = 2 N`],h:[`Rezina bilan Guk qonunini tekshiring (3 o‘lchash).`,`Yuk 2 baravar ortsa, cho‘zilish qanday o‘zgaradi?`]},
{n:`Nazorat ishi №1 (Kuchlar)`,d:`46-dars`,def:`Bo‘lim bo‘yicha bilimni baholash: kuch, gravitatsiya, ishqalanish, havo qarshiligi, elastiklik.`,f:[`F=ma`,`F=mg`,`F=μN`,`F=kΔx`],m:[`Vaqt: 25 daqiqa test + 15 daqiqa masalalar.`,`Baholash: 86–100% — 5; 71–85% — 4; 55–70% — 3.`],a:`Variantlar bo‘yicha yozma ish`,z:[[`Kuch birligi?`,[`Joul`,`Nyuton`,`Vatt`],1],[`m=5 kg, g=10 m/s². Og‘irlik kuchi?`,[`50 N`,`5 N`,`0,5 N`],0],[`Ishqalanish kuchi qaysi formulada?`,[`F=kΔx`,`F=μN`,`F=mg`],1],[`Prujina k=100 N/m, Δx=0,02 m. F=?`,[`2 N`,`5 N`,`0,2 N`],0]],h:[`Test xatolarini daftarga qayta yechib chiqing.`,`3 ta mustaqil masala tuzing va yeching.`]},
{n:`Laboratoriya: prujina bikrligi`,d:`47-dars`,def:`Maqsad: prujina bikrligini k = F/Δx = mg/Δx formulasi bilan tajribada aniqlash.`,f:[`k = m·g / Δx`,`k_o‘rt = (k₁+k₂+k₃)/3`,`ε = |k−k_o‘rt|/k_o‘rt·100%`],m:[`Jihozlar: shtativ, prujina, 100 g li yuklar, chizg‘ich.`,`1) Prujina uzunligi l₀ ni o‘lchang. 2) 1, 2, 3 ta yuk osib l ni o‘lchang. 3) Δx = l−l₀ (m ga o‘tkazing). 4) k ni hisoblab jadvalga yozing. 5) k_o‘rt va xatolikni toping.`,`Jadval: № | m (kg) | F (N) | Δx (m) | k (N/m).`,`Simulyatsiyada avval virtual tajriba qiling, so‘ng haqiqiy jihoz bilan takrorlang.`],a:`Guruhlarda ishlash (3–4 kishi)`,s:`spring`,q:[`m=0,2 kg, Δx=5 cm. k=?`,`F=2 N; k = 2/0,05 = 40 N/m`],h:[`Hisobotni to‘ldiring: jadval, k_o‘rt, xatolik, xulosa.`,`Xatolik manbalarini 3 ta yozing.`]},
{n:`Mexanik ish`,d:`48-dars`,def:`Kuch ta’sirida jism ko‘chsa, mexanik ish bajariladi. Ish kuch yo‘nalishidagi ko‘chish bilan aniqlanadi. Birligi: joul (J). Kuch ko‘chishga perpendikulyar bo‘lsa ish 0.`,f:[`A = F·s·cosα`,`1 J = 1 N·m`,`α=0° → A=F·s`],m:[`Qutini itarish: kuch bor, ko‘chish yo‘q → ish 0 (tushuntirish).`,`Sumkani ko‘tarib gorizontal yurish: A=0 (α=90°).`,`Ish grafigi: F–s grafigi ostidagi yuza = ish.`],a:`Yukni ko‘tarish va tortish`,s:`work`,q:[`F=50 N, s=4 m, α=0°. A=?`,`A = 50·4·1 = 200 J`],h:[`m=3 kg yukni 2 m balandlikka ko‘tarishda bajarilgan ish?`,`Ish 0 bo‘ladigan 3 ta holat keltiring.`]},
{n:`Energiya nima?`,d:`49–50-darslar`,def:`Energiya — jismning ish bajara olish qobiliyatini ifodalovchi kattalik (J). Bajarilgan ish energiya o‘zgarishiga teng. Energiya yo‘qolmaydi, faqat aylanadi.`,f:[`A = ΔE`,`E = E_k + E_p`,`[E] = J`],m:[`1-dars: «tayyor ish» obrazi — baland tosh, harakatdagi shar, siqilgan prujina.`,`2-dars: energiya va ish bog‘lanishi; masalalar yechish.`,`Simulyatsiya: m, v, h ni o‘zgartirib energiyani kuzating.`],a:`Domino va to‘p tajribasi`,s:`energy`,q:[`Energiya birligi? Ish bilan farqi?`,`Joul; ish — jarayon, energiya — holat kattaligi.`],h:[`Uyda energiyaga ega 5 ta jism toping va tur nomini yozing.`,`A=ΔE ga misol ko‘rsating.`]},
{n:`Energiya turlari`,d:`51–52 va 54-darslar`,def:`Kinetik energiya — harakat energiyasi. Potensial — vaziyat yoki deformatsiya energiyasi. Boshqa turlar: issiqlik, elektr, yorug‘lik, kimyoviy, yadro.`,f:[`E_k = m·v²/2`,`E_p = m·g·h`,`E_p(elastik) = k·x²/2`],m:[`51-dars: kinetik va potensial — rasmli jadval (shar, tosh, prujina).`,`52-dars: masalalar — E_k va E_p hisoblash.`,`54-dars: qaror: energiya turlari mini-test va misollar sinfda.`],a:`Maktab binosining 2-qavatidan tosh energiyasi (tahlil)`,s:`energy`,q:[`m=2 kg, v=5 m/s. E_k=?`,`E_k = 2·25/2 = 25 J`],h:[`m=4 kg, h=3 m: E_p=? (g=10)`,`Tezlik 2 baravar ortsa E_k necha baravar ortadi? (4 marta)`]},
{n:`Loyiha ishlari taqdimoti`,d:`53-dars`,def:`O‘quvchilar fizik model yasab taqdim etadi: g‘oya → tajriba → xulosa.`,f:[`Rubrika: g‘oya 20 · tajriba 30 · fizik asoslash 30 · taqdimot 20`],m:[`Mavzular: shamol tegirmoni, prujinali mashinacha, gidroelektrostansiya modeli, quyosh isitgichi.`,`Tuzilma: muammo, gipoteza, jihozlar, natija, energiya aylanishi sxemasi.`,`Har bir taqdimot 3–4 daqiqa, 2 ta savol.`],a:`Guruh loyihasi himoyasi`,h:[`Loyiha hisobotini 1 sahifada yozing (sxema bilan).`,`Sinfdoshlar loyihasiga 1 ta savol tayyorlang.`]},
{n:`Energiya aylanishi va uzatilishi`,d:`55-dars`,def:`Energiya bir turdan boshqasiga aylanadi va jismdan jismga uzatiladi. Yopiq tizimda to‘la energiya saqlanadi; ishqalanishda bir qismi issiqlikka aylanadi.`,f:[`E_k + E_p = const`,`E_k = E − m·g·h`],m:[`Mayatnik: eng yuqorida E_p max, pastda E_k max.`,`Zanjir: Quyosh → o‘simlik (kimyoviy) → ovqat → harakat.`,`Foydali ish koeffitsiyenti: η = A_foyd/A_to‘la.`],a:`Mayatnik va tushayotgan shar`,s:`pend`,q:[`Mayatnik pastki nuqtada. E_k va E_p nisbati?`,`E_k maksimal, E_p minimal (≈0).`],h:[`Elektr choynak, chiroq, velosiped uchun energiya aylanish zanjirini chizing.`,`Nima uchun mayatnik asta to‘xtaydi?`]},
{n:`Nazorat ishi №2 (Energiya)`,d:`56-dars`,def:`Bo‘lim yakuni: mexanik ish, energiya, turlari va aylanishi.`,f:[`A=Fs cosα`,`E_k=mv²/2`,`E_p=mgh`],m:[`Vaqt: 40 daqiqa. Test + 2 ta hisoblash masalasi.`],a:`Yozma ish`,z:[[`Ish birligi?`,[`N`,`J`,`W`],1],[`m=2 kg, h=5 m, g=10. E_p=?`,[`10 J`,`100 J`,`50 J`],1],[`m=4 kg, v=3 m/s. E_k=?`,[`18 J`,`12 J`,`36 J`],0],[`F⊥s bo‘lsa ish?`,[`F·s`,`0`,`maksimal`],1]],h:[`Xatolar daftarini tuzing.`,`Mexanik ish haqida 3 ta masala tuzing.`]},
{n:`Xatolar ustida ishlash`,d:`57-dars`,def:`Nazorat ishidagi xatolarni topish, sababini tushunish va to‘g‘ri yechimni mustaqil bajarish.`,f:[`Algoritm: xato → sabab → to‘g‘ri yechim → o‘xshash masala`],m:[`Tipik xatolar: massa va og‘irlikni aralashtirish; birliklar (g→kg, sm→m); cosα unutilishi; E_k da tezlikni kvadratga ko‘tarmaslik.`,`Juftlikda o‘zaro tekshirish; o‘qituvchi har bir guruhga individual izoh beradi.`,`Natija: «Xatolar daftari» + shaxsiy reja.`],a:`Juftlikda o‘zaro tekshiruv`,h:[`Barcha xatolarni qayta yeching.`,`Har bir xato uchun yangi o‘xshash masala tuzing.`]}
];
const arrow=(g,x,y,dx,dy,c)=>{g.strokeStyle=g.fillStyle=c;g.lineWidth=3;g.beginPath();g.moveTo(x,y);g.lineTo(x+dx,y+dy);g.stroke();const a=Math.atan2(dy,dx);g.beginPath();g.moveTo(x+dx,y+dy);g.lineTo(x+dx-10*Math.cos(a-.4),y+dy-10*Math.sin(a-.4));g.lineTo(x+dx-10*Math.cos(a+.4),y+dy-10*Math.sin(a+.4));g.fill()};
const bar=(g,x,b,v,mx,c,l,fg)=>{const h=Math.min(150,v/mx*150);g.fillStyle=c;g.fillRect(x,b-h,34,h);g.fillStyle=fg;g.font="12px sans-serif";g.fillText(l,x,b+14)};
const sims={
force:{c:[[`F₁ (N)`,0,20,8,1],[`α₁ (°)`,0,360,0,5],[`F₂ (N)`,0,20,6,1],[`α₂ (°)`,0,360,90,5]],d(g,v,s,fg,W,H){const x=W/2,y=H/2,r=Math.PI/180,k=8;const ax=v[0]*Math.cos(v[1]*r),ay=-v[0]*Math.sin(v[1]*r),bx=v[2]*Math.cos(v[3]*r),by=-v[2]*Math.sin(v[3]*r);arrow(g,x,y,ax*k,ay*k,`#2a7de1`);arrow(g,x,y,bx*k,by*k,`#e08a1e`);arrow(g,x,y,(ax+bx)*k,(ay+by)*k,`#d63a3a`);g.fillStyle=fg;g.beginPath();g.arc(x,y,5,0,7);g.fill();const R=Math.hypot(ax+bx,ay+by),d=(Math.atan2(-(ay+by),ax+bx)/r+360)%360;return `R = ${R.toFixed(1)} N, yo‘nalish ${d.toFixed(0)}° (qizil — teng ta’sir etuvchi)`}},
gravity:{c:[[`m (kg)`,1,100,10,1],[`g (m/s²)`,1.6,24.8,9.8,.1]],d(g,v,s,fg,W,H){const P=v[0]*v[1],L=Math.min(120,15+P/18);g.strokeStyle=fg;g.strokeRect(W/2-30,H/2-60,60,40+v[0]/4);g.fillStyle=fg;g.fillText(`${v[0]} kg`,W/2-18,H/2-35);arrow(g,W/2,H/2-20+v[0]/4,0,L,`#d63a3a`);const n=v[1]<3?`Oy`:v[1]<5?`Mars`:v[1]<12?`Yer`:`Yupiter`;return `Og‘irlik P = m·g = ${P.toFixed(1)} N (${n} yaqinida), massa o‘zgarmaydi: ${v[0]} kg`}},
friction:{c:[[`m (kg)`,1,20,5,1],[`μ`,0,1,.3,.05],[`F (N)`,0,100,30,1]],d(g,v,s,fg,W,H){const N=v[0]*9.8,Ff=v[1]*N,mv=v[2]>Ff,a=mv?(v[2]-Ff)/v[0]:0;s.x=(s.x||0)+(s.v=(s.v||0)+a/60)/60*3;if(!mv)s.v=0;if(s.x>W-90){s.x=0;s.v=0}const y=H/2+20;g.strokeStyle=fg;g.beginPath();g.moveTo(0,y+30);g.lineTo(W,y+30);g.stroke();g.strokeRect(20+s.x*18%(W-90),y-10,50,40);const bx=20+s.x*18%(W-90);arrow(g,bx+50,y+10,Math.min(80,v[2]),0,`#2a7de1`);arrow(g,bx,y+10,-Math.min(80,Ff),0,`#d63a3a`);return `N=${N.toFixed(0)} N, F_ish=${Ff.toFixed(1)} N, ${mv?`tezlanish a=${a.toFixed(2)} m/s²`:`jism qo‘zg‘almaydi (tinchlik ishqalanishi = F)`}`}},
air:{c:[[`m (kg)`,.1,10,1,.1],[`Yuza (m²)`,.02,1,.2,.02]],d(g,v,s,fg,W,H){const k=.6*v[1],m=v[0];s.v=s.v||0;s.y=s.y||10;const a=9.8-k*s.v*s.v/m;s.v+=a/60;s.y+=s.v*1.2;if(s.y>H-20){s.y=10;s.v=0}g.fillStyle=fg;g.beginPath();g.arc(W/2,s.y,6+v[1]*14,0,7);g.fill();arrow(g,W-60,s.y,0,Math.min(70,m*9.8*2),`#d63a3a`);arrow(g,W-80,s.y,0,-Math.min(70,k*s.v*s.v*2),`#2a7de1`);return `v = ${s.v.toFixed(1)} m/s, v_cheg = ${Math.sqrt(m*9.8/k).toFixed(1)} m/s (qizil: mg, ko‘k: qarshilik)`}},
spring:{c:[[`yuk m (g)`,0,500,100,10],[`k (N/m)`,5,100,25,1]],d(g,v,s,fg,W,H){const F=v[0]*9.8/1000,x=F/v[1],L=40+Math.min(130,x*100*3);g.strokeStyle=fg;g.lineWidth=2;g.beginPath();g.moveTo(W/2-40,15);g.lineTo(W/2+40,15);g.moveTo(W/2,15);for(let i=1;i<=14;i++)g.lineTo(W/2+(i%2?12:-12),15+L*i/15);g.lineTo(W/2,15+L);g.stroke();g.fillStyle=`#e08a1e`;g.fillRect(W/2-18,15+L,36,14+v[0]/25);g.fillStyle=fg;g.fillText(`Δx=${(x*100).toFixed(1)} sm`,W/2+40,15+L/2);return `F = mg = ${F.toFixed(2)} N, Δx = ${(x*100).toFixed(1)} sm, k = F/Δx = ${(F/x).toFixed(1)} N/m`}},
work:{c:[[`F (N)`,0,100,40,1],[`s (m)`,0,20,5,1],[`α (°)`,0,90,30,5]],d(g,v,s,fg,W,H){const r=Math.PI/180,A=v[0]*v[1]*Math.cos(v[2]*r),y=H/2+30,bx=20+v[1]/20*(W-120);g.strokeStyle=fg;g.beginPath();g.moveTo(0,y+30);g.lineTo(W,y+30);g.stroke();g.strokeRect(bx,y-10,50,40);g.fillStyle=fg;g.fillText(`s=${v[1]} m`,20,y+50);arrow(g,bx+25,y+10,Math.min(90,v[0])*Math.cos(v[2]*r),-Math.min(90,v[0])*Math.sin(v[2]*r),`#2a7de1`);return `A = F·s·cosα = ${A.toFixed(1)} J${v[2]==90?` (kuch ko‘chishga ⊥ → ish 0)`:``}`}},
energy:{c:[[`m (kg)`,1,20,2,1],[`v (m/s)`,0,30,5,1],[`h (m)`,0,50,10,1]],d(g,v,s,fg,W,H){const K=v[0]*v[1]*v[1]/2,P=v[0]*9.8*v[2],M=Math.max(K,P,1);g.fillStyle=fg;g.beginPath();g.arc(40,H-30-v[2]*3,9,0,7);g.fill();g.fillRect(10,H-20,60,3);arrow(g,52,H-30-v[2]*3,v[1]*2,0,`#2a7de1`);bar(g,140,H-30,K,M,`#2a7de1`,`E_k`,fg);bar(g,200,H-30,P,M,`#2db37a`,`E_p`,fg);bar(g,260,H-30,K+P,M,`#d63a3a`,`E`,fg);return `E_k=${K.toFixed(0)} J, E_p=${P.toFixed(0)} J, E=${(K+P).toFixed(0)} J`}},
pend:{c:[[`burchak (°)`,5,80,45,1],[`m (kg)`,.1,5,1,.1]],d(g,v,s,fg,W,H){const L=1.5;s.t=(s.t||0)+1/60;const th=v[0]*Math.PI/180*Math.cos(Math.sqrt(9.8/L)*s.t),px=90,py=20,bx=px+130*Math.sin(th),by=py+130*Math.cos(th);g.strokeStyle=fg;g.lineWidth=2;g.beginPath();g.moveTo(px,py);g.lineTo(bx,by);g.stroke();g.fillStyle=`#e08a1e`;g.beginPath();g.arc(bx,by,10,0,7);g.fill();const E=v[1]*9.8*L*(1-Math.cos(v[0]*Math.PI/180)),P=v[1]*9.8*L*(1-Math.cos(th)),K=Math.max(0,E-P);bar(g,190,H-30,K,E||1,`#2a7de1`,`E_k`,fg);bar(g,240,H-30,P,E||1,`#2db37a`,`E_p`,fg);bar(g,290,H-30,E,E||1,`#d63a3a`,`E`,fg);return `E_k=${K.toFixed(2)} J, E_p=${P.toFixed(2)} J, E=${E.toFixed(2)} J (saqlanadi)`}}
};
